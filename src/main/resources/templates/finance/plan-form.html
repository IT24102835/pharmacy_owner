<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Financial Plan</title>
</head>
<body>
    <h1>New Financial Plan</h1>
    <form th:action="@{/finance/plans}" th:object="${plan}" method="post">
        <div>
            <label>Plan Name:</label>
            <input type="text" th:field="*{planName}" />
        </div>
        <div>
            <label>Start Date:</label>
            <input type="date" th:field="*{startDate}" />
        </div>
        <div>
            <label>End Date:</label>
            <input type="date" th:field="*{endDate}" />
        </div>
        <div>
            <label>Budget:</label>
            <input type="text" th:field="*{budget}" />
        </div>
        <div>
            <button type="submit">Save</button>
        </div>
    </form>
</body>
</html>
