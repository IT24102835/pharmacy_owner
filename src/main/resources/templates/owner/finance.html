<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Financial Management</title>
</head>
<body>
    <h1>Financial Management</h1>

    <!-- Create Financial Plan -->
    <h2>Create New Financial Plan</h2>
    <form th:action="@{/owner/finance/plans}" th:object="${newPlan}" method="post">
        <div>
            <label>Plan Name:</label>
            <input type="text" th:field="*{planName}" required/>
        </div>
        <div>
            <label>Description:</label>
            <textarea th:field="*{description}"></textarea>
        </div>
        <div>
            <label>Start Date:</label>
            <input type="date" th:field="*{startDate}" required/>
        </div>
        <div>
            <label>End Date:</label>
            <input type="date" th:field="*{endDate}" required/>
        </div>
        <button type="submit">Create Plan</button>
    </form>

    <hr/>

    <!-- List of Financial Plans -->
    <h2>Existing Financial Plans</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="plan : ${financialPlans}">
                <td th:text="${plan.planId}"></td>
                <td th:text="${plan.planName}"></td>
                <td th:text="${plan.startDate}"></td>
                <td th:text="${plan.endDate}"></td>
                <td th:text="${plan.status}"></td>
            </tr>
        </tbody>
    </table>

    <a th:href="@{/owner/dashboard}">Back to Dashboard</a>
</body>
</html>
