<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Staff</title>
</head>
<body>
    <h1>Manage Staff</h1>
    <a href="/admin/staff/new">Add New Staff</a>
    <table border="1">
        <thead>
            <tr>
                <th>Username</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="staff : ${staffList}">
                <td th:text="${staff.username}"></td>
                <td th:text="${staff.role}"></td>
                <td>
                    <a th:href="@{/admin/staff/edit/{id}(id=${staff.id})}">Edit</a>
                    <a th:href="@{/admin/staff/delete/{id}(id=${staff.id})}">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
    <a href="/finance/dashboard">Back to Dashboard</a>
</body>
</html>
